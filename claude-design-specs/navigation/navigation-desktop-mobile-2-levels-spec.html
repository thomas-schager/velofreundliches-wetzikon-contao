document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --vw-danger-tint:    rgba(220,52,6,0.12);\n  --vw-success-ring:   rgba(41,99,16,0.12);\n  --vw-focus-ring:     rgba(220,52,6,0.15);\n  --vw-label-muted:    #6b6b67;   /* eyebrow label color (4.6:1 on white) */\n\n  /* --- Neutral scale (warm-neutral) ------------------- */\n  --vw-bg:             #fafaf8;   /* page background */\n  --vw-surface:        #ffffff;   /* cards, nav */\n  --vw-surface-2:      #f4f3ef;   /* sunken sections */\n  --vw-border:         #e8e6e0;   /* hairline borders */\n  --vw-border-strong:  #cfcdc6;\n  --vw-muted:          #8a8a86;   /* secondary text */\n  --vw-muted-strong:   #5e5e5a;\n\n  /* --- Semantic ------------------------------------- */\n  --vw-text:           var(--vw-dark);\n  --vw-text-secondary: var(--vw-muted-strong);\n  --vw-link:           var(--vw-primary);\n  --vw-link-hover:     var(--vw-primary-press);\n\n  /* --- Type families -------------------------------- */\n  --vw-font-display:   'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --vw-font-body:      'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n\n  /* --- Type scale ----------------------------------- */\n  --vw-text-xs:   12px;\n  --vw-text-sm:   14px;\n  --vw-text-base: 16px;\n  --vw-text-lg:   18px;\n  --vw-text-xl:   22px;\n  --vw-text-2xl:  28px;\n  --vw-text-3xl:  36px;\n  --vw-text-4xl:  48px;\n  --vw-text-5xl:  64px;\n  --vw-text-6xl:  80px;\n\n  /* --- Line heights --------------------------------- */\n  --vw-lh-tight:  1.05;\n  --vw-lh-snug:   1.2;\n  --vw-lh-normal: 1.45;\n  --vw-lh-relaxed:1.6;\n\n  /* --- Letter spacing ------------------------------- */\n  --vw-tracking-tight: -0.01em;\n  --vw-tracking-wide:  0.08em;\n\n  /* --- Spacing (8px grid) --------------------------- */\n  --vw-s-1: 4px;\n  --vw-s-2: 8px;\n  --vw-s-3: 12px;\n  --vw-s-4: 16px;\n  --vw-s-5: 24px;\n  --vw-s-6: 32px;\n  --vw-s-7: 48px;\n  --vw-s-8: 64px;\n  --vw-s-9: 96px;\n  --vw-s-10: 128px;\n\n  /* --- Radii ---------------------------------------- ht: 400;\n  font-size: var(--vw-text-xl);\n  line-height: var(--vw-lh-relaxed);\n  color: var(--vw-text-secondary);\n}\n.vw-body {\n  font-family: var(--vw-font-body);\n  font-weight: 400;\n  font-size: var(--vw-text-base);\n  line-height: var(--vw-lh-relaxed);\n  color: var(--vw-text);\n}\n.vw-small {\n  font-family: var(--vw-font-body);\n  font-weight: 400;\n  font-size: var(--vw-text-sm);\n  line-height: var(--vw-lh-normal);\n  color: var(--vw-text-secondary);\n}\n.vw-caption {\n  font-family: var(--vw-font-body);\n  font-weight: 500;\n  font-size: var(--vw-text-xs);\n  letter-spacing: 0.02em;\n  color: var(--vw-muted);\n}\n\n/* =========================================================\n   Base reset (opt-in: apply on <body class=\"vw\">)\n   ========================================================= */\n\n.vw {\n  font-family: var(--vw-font-body);\n  font-size: var(--vw-text-base);\n  line-height: var(--vw-lh-relaxed);\n  color: var(--vw-text);\n  background: var(--vw-bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n.vw a {\n  color: var(--vw-link);\n  text-decoration: underline;\n  text-underline-offset: 2px;\n  text-decoration-thickness: 1px;\n  transition: color var(--vw-dur) var(--vw-ease);\n}\n.vw a:hover { color: var(--vw-link-hover); }\n.vw a.vw-nav-link { text-decoration: none; }\n.vw a.vw-nav-link:hover { text-decoration: underline; }\n\n.vw ::selection { background: var(--vw-primary); color: #fff; }\n\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0;\n  font-family: var(--vw-font-body);\n  font-size: var(--vw-text-base);\n  line-height: var(--vw-lh-relaxed);\n  color: var(--vw-text);\n  background: var(--vw-bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\nimg { max-width: 100%; display: block; }\na { color: inherit; }\nbutton { font: inherit; cursor: pointer; }\n::selection { background: var(--vw-primary); color: #fff; }\n\n/* ---- Layout primitives -------------------------------- */\n.vw-container { max-width: var(--vw-container); margin: 0 auto; padding-inline: 20px; }\n@media (min-width: 600px) { .vw-container { padding-inline: 32px; } }\n.vw-section { padding-block: 40px; }\n@media (min-width: 600px) { .vw-section { padding-block: 56px; } }\n@media (min-width: 960px) { .vw-section { padding-block: 72px; } }\n\n/* image placeholder ------------------------------------- */\n.vw-img {\n  background:\n    repeating-linear-gradient(135deg, #d9d6cf 0 6px, #e8e6e0 6px 12px), #e8e6e0;\n  position: relative; overflow: hidden; width: 100%;\n}\n.vw-img__cap {\n  position: absolute; left: 10px; bottom: 10px;\n  background: rgba(255,255,255,0.92); padding: 4px 9px; border-radius: 3px;\n  font-family: 'Roboto Mono', ui-monospace, monospace;\n  font-size: 11px; color: var(--vw-muted-strong); letter-spacing: 0.02em;\n}\n\n/* ---- Typography helpers ------------------------------- */\n.vw-eyebrow {\n  font-family: var(--vw-font-body); font-weight: 700; font-size: 12px;\n  letter-spacing: 0.08em; text-transform: uppercase; color: var(--vw-primary);\n}\n.vw-eyebrow--accent { color: var(--vw-accent); }\n\n/* ---- Buttons ------------------------------------------ */\n.vw-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  font-family: var(--vw-font-body); font-weight: 500; font-size: 15px;\n  line-height: 1; letter-spacing: 0.01em;\n  padding: 12px 20px; border-radius: var(--vw-radius-sm);\n  border: 1px solid transparent; min-height: 44px;\n  transition: background var(--vw-dur) var(--vw-ease), color var(--vw-dur) var(--vw-ease), transform var(--vw-dur-fast) var(--vw-ease);\n}\n.vw-btn svg { width: 16px; height: 16px; flex-shrink: 0; }\n.vw-btn--lg { padding: 14px 26px; font-size: 17px; min-height: 50px; }\n.vw-btn--sm { padding: 8px 14px; font-size: 13px; min-height: 38px; }\n.vw-btn--primary { background: var(--vw-primary); color: #fff; }\n.vw- dex: 40;\n  background: rgba(255,255,255,0.96); backdrop-filter: blur(6px);\n  border-bottom: 1px solid var(--vw-border);\n}\n.vw-nav__inner {\n  max-width: var(--vw-container); margin: 0 auto; padding-inline: 20px;\n  height: 64px; display: flex; align-items: center; gap: 24px;\n}\n@media (min-width: 600px) { .vw-nav__inner { padding-inline: 32px; height: 72px; } }\n\n/* Logo wordmark */\n.vw-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; height: 38px; }\n.vw-logo__bar { width: 5px; height: 32px; background: var(--vw-primary); flex-shrink: 0; }\n.vw-logo__text { display: flex; flex-direction: column; line-height: 1; color: var(--vw-dark); }\n.vw-logo__a { font-family: var(--vw-font-display); font-weight: 500; font-size: 12px; letter-spacing: -0.005em; }\n.vw-logo__b { font-family: var(--vw-font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.16em; margin-top: 3px; }\n.vw-logo--ondark .vw-logo__text { color: #fff; }\n\n.vw-nav__links { display: none; }\n.vw-nav__spacer { flex: 1; }\n.vw-nav__cta { display: none; }\n.vw-nav__link {\n  font-family: var(--vw-font-body); font-size: 14px; font-weight: 500;\n  color: var(--vw-dark); text-decoration: none; padding: 6px 0;\n  text-underline-offset: 5px; text-decoration-thickness: 1px;\n}\n.vw-nav__link:hover { text-decoration: underline; }\n.vw-nav__link--active { color: var(--vw-primary); }\n\n/* hamburger */\n.vw-burger {\n  margin-left: auto; width: 44px; height: 44px; border: 1px solid var(--vw-border);\n  border-radius: var(--vw-radius-sm); background: #fff; color: var(--vw-dark);\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.vw-burger svg { width: 22px; height: 22px; }\n\n/* mobile drawer */\n.vw-drawer {\n  position: fixed; inset: 0; z-index: 60; visibility: hidden;\n}\n.vw-drawer__scrim {\n  position: absolute; inset: 0; background: rgba(0,0,0,0.4);\n  opacity: 0; transition: opacity var(--vw-dur) var(--vw-ease);\n}\n.vw-drawer__panel  }\n    .vw-acc__head {\n      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;\n      background: none; border: 0; cursor: pointer; text-align: left;\n      font-family: var(--vw-font-body); font-size: 17px; font-weight: 500; color: var(--vw-dark);\n      padding: 15px 4px;\n    }\n    .vw-acc__head[aria-current=\"page\"] { color: var(--vw-primary); }\n    .vw-acc__chev { width: 20px; height: 20px; color: var(--vw-muted); transition: transform var(--vw-dur) var(--vw-ease); flex-shrink: 0; }\n    .vw-acc.is-open .vw-acc__chev { transform: rotate(180deg); }\n    .vw-acc__panel { overflow: hidden; max-height: 0; transition: max-height var(--vw-dur) var(--vw-ease); }\n    .vw-acc.is-open .vw-acc__panel { max-height: 320px; }\n    .vw-acc__sub {\n      display: block; text-decoration: none; color: var(--vw-muted-strong); font-size: 15px;\n      padding: 11px 4px 11px 18px; border-left: 2px solid var(--vw-border); margin-left: 4px;\n      transition: color var(--vw-dur) var(--vw-ease), border-color var(--vw-dur) var(--vw-ease);\n    }\n    .vw-acc__sub:last-child { margin-bottom: 8px; }\n    .vw-acc__sub:hover { color: var(--vw-primary); border-color: var(--vw-primary); }\n    .vw-acc__link {\n      display: block; text-decoration: none; color: var(--vw-dark); font-size: 17px; font-weight: 500;\n      padding: 15px 4px; border-bottom: 1px solid var(--vw-border);\n    }\n    .nv-mdrawer .vw-btn { margin-top: 18px; }\n\n    /* two columns on wide screens for the two demos */\n    .nv-grid { display: grid; grid-template-columns: 1fr; gap: 48px; }\n\n    /* structure legend */\n    .nv-legend { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 20px; }\n    @media (min-width: 720px) { .nv-legend { grid-template-columns: repeat(2, 1fr); } }\n    @media (min-width: 1040px) { .nv-legend { grid-template-columns: repeat(4, 1fr); } }\n    .nv-col { background: #fff; border: 1px solid var(--vw-border); border-radius: var(--v 0 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Neuigkeiten<\u002Fli>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Projekte der Stadt<\u002Fli>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Ufsteller<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"nv-col\">\n          <p class=\"nv-col__h\">Tests<\u002Fp>\n          <p class=\"nv-col__meta\">2 Unterpunkte<\u002Fp>\n          <ul>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Velowege und Strasseninfrastruktur<\u002Fli>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Parkplätze und Abstellmöglichkeiten<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"nv-col\">\n          <p class=\"nv-col__h\">Service<\u002Fp>\n          <p class=\"nv-col__meta\">3 Unterpunkte<\u002Fp>\n          <ul>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Ausflüge<\u002Fli>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Velowerkstätten<\u002Fli>\n            <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Links<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div class=\"nv-col nv-col--leaf\">\n          <p class=\"nv-col__h\">Kontakt<\u002Fp>\n          <p class=\"nv-col__meta\">Direkter Link<\u002Fp>\n          <p class=\"nv-col__none\">Keine Unterebene — führt direkt auf die Kontaktseite.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ DESKTOP DEMO ============ -->\n    <div class=\"nv-block\">\n      <div class=\"nv-block__label\">\n        <span class=\"vw-tag vw-tag--primary\">Desktop<\u002Fspan>\n        <h2>Dropdown beim Hovern oder per Tastatur<\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"nv-hint\">Fahren Sie mit der Maus über <b>News<\u002Fb>, <b>Tests<\u002Fb> oder <b>Service<\u002Fb> — oder navigieren Sie mit <kbd>Tab<\u002Fkbd> und öffnen Sie mit <kbd>Enter<\u002Fkbd>.<\u002Fp>\n      <div class=\"nv-demo-desktop\">\n        <nav class=\"vw-nav\" aria-label=\"Hauptnavigation Desktop\">\n          <div class=\"vw-nav__inner\">\n            <a class=\"vw-logo\" href=\"#\" aria-label=\"velofreundliches Wetzikon — Start\">\n              <span class=\"vw-logo__bar\"><\u002Fspan>\n              <span class=\"vw-logo__text\">\n                <span class=\"vw-logo__a\">velofreundliches<\u002Fspan>\n                <span class=\"vw-logo__b\">WETZIKON<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fa>\n            <div class=\"vw-nav__links\">\n              <div class=\"vw-nav__item vw-nav__item--active\">\n                <button class=\"vw-nav__trigger\" type=\"button\" aria-expanded=\"false\" aria-haspopup=\"true\">News\n                  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                <\u002Fbutton>\n                <div class=\"vw-nav__menu\" role=\"menu\">\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Neuigkeiten<\u002Fb><span>Aktuelles aus dem Verein<\u002Fspan><\u002Fa>\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Projekte der Stadt<\u002Fb><span>Was Wetzikon plant und baut<\u002Fspan><\u002Fa>\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Ufsteller<\u002Fb><span>Erfreuliches rund ums Velo<\u002Fspan><\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"vw-nav__item\">\n                <button class=\"vw-nav__trigger\" type=\"button\" aria-expanded=\"false\" aria-haspopup=\"true\">Tests\n                  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                <\u002Fbutton>\n                <div class=\"vw-nav__menu\" role=\"menu\">\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Velowege und Strasseninfrastruktur<\u002Fb><span>Routen, Knoten und Markierungen im Test<\u002Fspan><\u002Fa>\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Parkplätze und Abstellmöglichkeiten<\u002Fb><span>Abstellanlagen unter der Lupe<\u002Fspan><\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"vw-nav__item\">\n                <button class=\"vw-nav__trigger\" type=\"button\" aria-expanded=\"false\" aria-haspopup=\"true\">Service\n                  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                <\u002Fbutton>\n                <div class=\"vw-nav__menu\" role=\"menu\">\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Ausflüge<\u002Fb><span>Tourenvorschläge in der Region<\u002Fspan><\u002Fa>\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Velowerkstätten<\u002Fb><span>Reparatur und Selbsthilfe<\u002Fspan><\u002Fa>\n                  <a class=\"vw-nav__suba\" href=\"#\" role=\"menuitem\"><b>Links<\u002Fb><span>Nützliches und Partner<\u002Fspan><\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"vw-nav__item\">\n                <a class=\"vw-nav__trigger\" href=\"#\">Kontakt<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span class=\"vw-nav__spacer\"><\u002Fspan>\n            <a class=\"vw-btn vw-btn--primary vw-btn--sm vw-nav__cta\" href=\"#\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n              Stelle melden\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fnav>\n        <div class=\"nv-demo-fill\"><span>Seiteninhalt …<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ MOBILE DEMO ============ -->\n    <div class=\"nv-block\">\n      <div class=\"nv-block__label\">\n        <span class=\"vw-tag vw-tag--primary\">Mobile<\u002Fspan>\n        <h2>Akkordeon-Menü<\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"nv-hint\">Tippen Sie im Telefon auf das <b>Menü-Symbol<\u002Fb>, dann auf einen Hauptpunkt, um die Unterebene aufzuklappen. <b>Kontakt<\u002Fb> öffnet direkt. Die <b>Stelle melden<\u002Fb>-CTA steht zuunterst gut erreichbar.<\u002Fp>\n      <div class=\"nv-phone\">\n        <div class=\"nv-phone__notch\"><\u002Fdiv>\n        <div class=\"nv-phone__screen\">\n          <div class=\"nv-mnav\">\n            <a class=\"vw-logo\" href=\"#\" aria-label=\"Start\">\n              <span class=\"vw-logo__bar\"><\u002Fspan>\n              <span class=\"vw-logo__text\">\n                <span class=\"vw-logo__a\">velofreundliches<\u002Fspan>\n                <span class=\"vw-logo__b\">WETZIKON<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fa>\n            <button class=\"nv-mnav__burger\" type=\"button\" aria-label=\"Menü öffnen\" aria-expanded=\"false\" id=\"mBurger\">\n              <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><line x1=\"4\" y1=\"7\" x2=\"20\" y2=\"7\"><\u002Fline><line x1=\"4\" y1=\"12\" x2=\"20\" y2=\"12\"><\u002Fline><line x1=\"4\" y1=\"17\" x2=\"20\" y2=\"17\"><\u002Fline><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 18px; color:var(--vw-muted); font-size:14px;\">Startseite …<\u002Fdiv>\n\n          <!-- drawer -->\n          <div class=\"nv-mdrawer\" id=\"mDrawer\" aria-hidden=\"true\">\n            <div class=\"nv-mdrawer__scrim\" data-mclose=\"\"><\u002Fdiv>\n            <div class=\"nv-mdrawer__panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Navigation\">\n              <div class=\"nv-mdrawer__head\">\n                <a class=\"vw-logo\" href=\"#\" aria-label=\"Start\">\n                  <span class=\"vw-logo__bar\"><\u002Fspan>\n                  <span class=\"vw-logo__text\">\n                    <span class=\"vw-logo__a\">velofreundliches<\u002Fspan>\n                    <span class=\"vw-logo__b\">WETZIKON<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fa>\n                <button class=\"nv-mdrawer__close\" type=\"button\" aria-label=\"Menü schliessen\" data-mclose=\"\">\n                  <svg viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\"><line x1=\"1\" y1=\"1\" x2=\"13\" y2=\"13\"><\u002Fline><line x1=\"13\" y1=\"1\" x2=\"1\" y2=\"13\"><\u002Fline><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"nv-mdrawer__scroll\">\n                <!-- News -->\n                <div class=\"vw-acc is-open\">\n                  <button class=\"vw-acc__head\" type=\"button\" aria-expanded=\"true\" aria-current=\"page\">News\n                    <svg class=\"vw-acc__chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fbutton>\n                  <div class=\"vw-acc__panel\">\n                    <a class=\"vw-acc__sub\" href=\"#\">Neuigkeiten<\u002Fa>\n                    <a class=\"vw-acc__sub\" href=\"#\">Projekte der Stadt<\u002Fa>\n                    <a class=\"vw-acc__sub\" href=\"#\">Ufsteller<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <!-- Tests -->\n                <div class=\"vw-acc\">\n                  <button class=\"vw-acc__head\" type=\"button\" aria-expanded=\"false\">Tests\n                    <svg class=\"vw-acc__chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fbutton>\n                  <div class=\"vw-acc__panel\">\n                    <a class=\"vw-acc__sub\" href=\"#\">Velowege und Strasseninfrastruktur<\u002Fa>\n                    <a class=\"vw-acc__sub\" href=\"#\">Parkplätze und Abstellmöglichkeiten<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <!-- Service -->\n                <div class=\"vw-acc\">\n                  <button class=\"vw-acc__head\" type=\"button\" aria-expanded=\"false\">Service\n                    <svg class=\"vw-acc__chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fbutton>\n                  <div class=\"vw-acc__panel\">\n                    <a class=\"vw-acc__sub\" href=\"#\">Ausflüge<\u002Fa>\n                    <a class=\"vw-acc__sub\" href=\"#\">Velowerkstätten<\u002Fa>\n                    <a class=\"vw-acc__sub\" href=\"#\">Links<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <!-- Kontakt (leaf) -->\n                <a class=\"vw-acc__link\" href=\"#\">Kontakt<\u002Fa>\n\n                <a class=\"vw-btn vw-btn--primary vw-btn--block\" href=\"#\">\n                  <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                  Stelle melden\n                <\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script>\n    /* ---- Desktop: click-to-toggle + keyboard + close on outside/Esc ---- */\n    (function () {\n      var items = Array.prototype.slice.call(document.querySelectorAll('.nv-demo-desktop .vw-nav__item'));\n      items.forEach(function (item) {\n        var trigger = item.querySelector('.vw-nav__trigger');\n        if (trigger.tagName !== 'BUTTON') return;\n        trigger.addEventListener('click', function () {\n          var open = item.classList.contains('is-open');\n          items.forEach(function (i) { i.classList.remove('is-open'); var t = i.querySelector('.vw-nav__trigger'); if (t.tagName === 'BUTTON') t.setAttribute('aria-expanded', 'false'); });\n          if (!open) { item.classList.add('is-open'); trigger.setAttribute('aria-expanded', 'true'); }\n        });\n      });\n      document.addEventListener('click', function (e) {\n        if (!e.target.closest('.nv-demo-desktop .vw-nav__item')) {\n          items.forEach(function (i) { i.classList.remove('is-open'); var t = i.querySelector('.vw-nav__trigger'); if (t.tagName === 'BUTTON') t.setAttribute('aria-expanded', 'false'); });\n        }\n      });\n      document.addEventListener('keydown', function (e) {\n        if (e.key === 'Escape') items.forEach(function (i) { i.classList.remove('is-open'); var t = i.querySelector('.vw-nav__trigger'); if (t.tagName === 'BUTTON') t.setAttribute('aria-expanded', 'false'); });\n      });\n    })();\n\n    /* ---- Mobile drawer ---- */\n    (function () {\n      var drawer = document.getElementById('mDrawer');\n      var burger = document.getElementById('mBurger');\n      function open() { drawer.classList.add('is-open'); drawer.setAttribute('aria-hidden', 'false'); burger.setAttribute('aria-expanded', 'true'); }\n      function close() { drawer.classList.remove('is-open'); drawer.setAttribute('aria-hidden', 'true'); burger.setAttribute('aria-expanded', 'false'); }\n      burger.addEventListener('click', open);\n      drawer.querySelectorAll('[data-mclose]').forEach(function (el) { el.addEventListener('click', close); });\n    })();\n\n    /* ---- Mobile accordion (single-open) ---- */\n    (function () {\n      var accs = Array.prototype.slice.call(document.querySelectorAll('.vw-acc'));\n      accs.forEach(function (acc) {\n        var head = acc.querySelector('.vw-acc__head');\n        head.addEventListener('click', function () {\n          var open = acc.classList.contains('is-open');\n          accs.forEach(function (a) { a.classList.remove('is-open'); a.querySelector('.vw-acc__head').setAttribute('aria-expanded', 'false'); });\n          if (!open) { acc.classList.add('is-open'); head.setAttribute('aria-expanded', 'true'); }\n        });\n      });\n    })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
